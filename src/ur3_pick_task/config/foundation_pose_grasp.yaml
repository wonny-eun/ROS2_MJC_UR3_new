# Grasp pose for ``foundation_pose_grasp`` (FoundationPose → MoveIt IK on gripper_tip).
#
# Position (XYZ in base_link):
#   Start from FP object origin (mesh centre), then add grip_point_offset_m:
#     grip_point_offset_frame: base_link  → offset along fixed base X/Y/Z (global).
#     grip_point_offset_frame: object    → offset in fp_object / mesh axes (rotates with object).
#   approach_standoff_m retreats along opposite base look-at (+Z when lookat is [0,0,-1]).
#
# Orientation (base_link, same as cartesian steps in ur3_action_sequence.yaml):
#   lookat_vector: TCP +Z direction in base_link (default vertical down).
#   sync_object_yaw_as_tcp_roll: object yaw about base +Z → TCP roll about approach axis.
#   tcp_roll_rad: extra roll offset (radians) added on top of synced yaw.

grasp_by_class:
  Box_1:
    grip_point_offset_frame: base_link
    grip_point_offset_m: [0.0, -0.05, 0.0]
    lookat_vector: [0.0, 0.0, -1.0]
    sync_object_yaw_as_tcp_roll: false
    tcp_roll_rad: 0.0

  Cylinder_1:
    grip_point_offset_frame: base_link
    grip_point_offset_m: [0.0, -0.035, 0.00]
    lookat_vector: [0.0, 0.0, -1.0]
    sync_object_yaw_as_tcp_roll: false
    tcp_roll_rad: 0.0

  Cylinder_2:
    grip_point_offset_frame: base_link
    grip_point_offset_m: [0.0, -0.05, 0.00]
    lookat_vector: [0.0, 0.0, -1.0]
    sync_object_yaw_as_tcp_roll: false
    tcp_roll_rad: -1.57
