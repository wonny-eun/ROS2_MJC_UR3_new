mujoco_weld_presets:
  Box_1_module_1_case:
    target_pose_topic: /mujoco/weld/module_1_plate_case_offset
    service_name: /mujoco/weld/module_1_plate_attach_case_base
    target_frame: Case_Base
    target_xyz: [0.0, 0.0, 0.0]
    target_quat_xyzw: [-0.707, 0.707, 0.0, 0.0]
    pose_settle_sec: 0.05
  Box_1_module_2_tool0:
    target_pose_topic: /mujoco/weld/module_1_plate_case_offset
    service_name: /mujoco/weld/module_1_plate_attach_case_base
    target_frame: Case_Base
    target_xyz: [0.0, 0.0, 0.0]
    target_quat_xyzw: [-0.707, 0.707, 0.0, 0.0]
    pose_settle_sec: 0.05
    
    
    
    
    
    
sequences:
  # YOLO: one-shot center + approach to 370 mm (vision.target_distance_m).
  Box_1:
    - name: Look
      type: joint
      target: [-1.186824, -2.338741, 2.042035, -1.850049, -1.500983, -3.159046]
      velocity_scaling: 0.25
      acceleration_scaling: 0.25
      delay_after_sec: 0.3

    - name: Visual_Center_YOLO
      type: yolo_visual_center
      target_class: Box_1
      yolo_visual_center_centering_mode: moveit_one_shot
      # Only Box_1 in scene filter — avoids cylinder fallback when box conf is low.
      yolo_exclusive_scene_classes: [Box_1]
      yolo_visual_center_acquire_min_confidence: 0.02
      min_confidence: 0.25
      depth_roi_half_px: 12
      yolo_visual_center_avoid_collisions: false
      velocity_scaling: 0.12
      acceleration_scaling: 0.12
      max_step_m: 0.001
      min_fraction: 0.32
      approach_max_iterations: 4
      yolo_visual_center_min_detection_depth_m: 0.30
      delay_after_sec: 0.2

  # Full Box_1 pick path (restored): joint + waypoint + linear/moveit Cartesian + weld + YOLO.
  Box_1_Module1:
    - name: Home
      type: joint
      target: [-1.1087415474606372, -2.486418483252553, 0.8887611840430981, -0.5784636843911983, -1.636715068954524, -3.141592]
      velocity_scaling: 0.2
      acceleration_scaling: 0.2
      delay_after_sec: 2.0

    - name: Stage_1_Approach
      type: waypoint
      blending_radius: 0.02
      velocity_scaling: 0.05
      acceleration_scaling: 0.1
      waypoints:
        - name: Stage_1_Module_1_Approach
          type: joint
          target: [-1.570796326794896, -1.570796326794896, 1.570796326794896, -1.570796326794896, -1.570796326794896, -3.141592]
        - name: Stage_1_Module_1_Target
          type: cartesian
          target_xyz: [0.05, -0.20, 0.1]
          lookat_vector: [0.0, 0.0, -1.0]
          tcp_roll_rad: 1.570796326794896

    - name: Stage_1_Module_1_Lower
      type: cartesian
      cartesian_mode: linear
      target_xyz: [0.05, -0.20, 0.013864]
      lookat_vector: [0.0, 0.0, -1.0]
      tcp_roll_rad: 1.570796326794896
      max_step_m: 0.0005
      min_fraction: 0.95
      velocity_scaling: 0.1
      acceleration_scaling: 0.1
      delay_after_sec: 0.5

    - name: Weld_Module_1_To_Case_Base
      type: weld
      mujoco_weld_preset: Box_1_module_1_case
      delay_after_sec: 0.6

    - name: Stage_1_Module_1_Upper
      type: cartesian
      cartesian_mode: linear
      target_xyz: [0.05, -0.20, 0.10]
      lookat_vector: [0.0, 0.0, -1.0]
      tcp_roll_rad: 1.570796326794896
      max_step_m: 0.0005
      min_fraction: 0.95
      velocity_scaling: 0.1
      acceleration_scaling: 0.1
      delay_after_sec: 0.5
      attach_preset: Box_1_module_1_attach_tool0

    - name: Stage_1_Module_2_Target
      type: cartesian
      cartesian_mode: moveit
      target_xyz: [0.05, -0.366, 0.10]
      lookat_vector: [0.0, 0.0, -1.0]
      tcp_roll_rad: 0
      velocity_scaling: 0.15
      acceleration_scaling: 0.15
      delay_after_sec: 0.2

  Box_1_Module2:
    - name: Stage_1_Module_2_Lower
      type: cartesian
      cartesian_mode: linear
      target_xyz: [0.05, -0.366, 0.058864]
      lookat_vector: [0.0, 0.0, -1.0]
      tcp_roll_rad: 0
      max_step_m: 0.005
      min_fraction: 0.95
      velocity_scaling: 0.1
      acceleration_scaling: 0.1
      delay_after_sec: 0.5

    - name: Weld_Module_2_Tips_To_Fingers
      type: trigger
      service_name: /mujoco/weld/module_2_tips_attach_fingers
      wait_timeout_sec: 3.0
      call_timeout_sec: 5.0
      delay_after_sec: 0.2

    - name: Stage_1_Module_2_Upper
      type: cartesian
      cartesian_mode: linear
      target_xyz: [0.05, -0.366, 0.10]
      lookat_vector: [0.0, 0.0, -1.0]
      tcp_roll_rad: 0
      max_step_m: 0.005
      min_fraction: 0.95
      velocity_scaling: 0.1
      acceleration_scaling: 0.1
      delay_after_sec: 0.5

    - name: Look
      type: joint
      target: [-1.186824, -2.338741, 2.042035, -1.850049, -1.500983, -3.159046]
      velocity_scaling: 0.2
      acceleration_scaling: 0.2
      delay_after_sec: 2.0

    - name: Module_2_Visual_Center_YOLO
      type: yolo_visual_center
      target_class: Box_1
      yolo_visual_center_centering_mode: moveit_one_shot
      avoid_collisions: true
      velocity_scaling: 0.12
      acceleration_scaling: 0.12
      max_step_m: 0.005
      min_fraction: 0.85
      delay_after_sec: 0.3
      
      
    - name: FoundationPose_And_GraspPrep
      type: foundation_pose
      target_class: Box_1
      yolo_exclusive_scene_classes: [Box_1]
      include_grasp_prep_orientation: true
      lookat_vector: [0.0, 0.0, -1.0]
      tcp_roll_rad: 0.0
      velocity_scaling: 0.12
      acceleration_scaling: 0.12
      delay_after_sec: 0.2

    - name: Detach_Module_2_Tips_To_World
      type: trigger
      service_name: /mujoco/weld/module_2_tips_detach_world
      wait_timeout_sec: 10.0
      call_timeout_sec: 15.0
      delay_after_sec: 0.2

  Cylinder_1:
    - name: Look
      type: joint
      target: [-1.186824, -2.338741, 2.042035, -1.850049, -1.500983, -3.159046]
      velocity_scaling: 0.25
      acceleration_scaling: 0.25
      delay_after_sec: 0.3

    - name: Visual_Center_YOLO
      type: yolo_visual_center
      target_class: Cylinder_1
      velocity_scaling: 0.12
      acceleration_scaling: 0.12
      max_step_m: 0.005
      min_fraction: 0.85
      delay_after_sec: 0.2
      
    - name: FoundationPose_And_GraspPrep
      type: foundation_pose
      target_class: Cylinder_1
      yolo_exclusive_scene_classes: [Cylinder_1]
      include_grasp_prep_orientation: true
      lookat_vector: [0.0, 0.0, -1.0]
      tcp_roll_rad: 0.0
      velocity_scaling: 0.12
      acceleration_scaling: 0.12
      delay_after_sec: 0.2

  # Test path: includes FoundationPose bridge trigger + Isaac TF wait + TCP look-down prep.
  Cylinder_2:
    - name: Look
      type: joint
      target: [-1.186824, -2.338741, 2.042035, -1.850049, -1.500983, -3.159046]
      velocity_scaling: 0.25
      acceleration_scaling: 0.25
      delay_after_sec: 0.3

    - name: Visual_Center_YOLO
      type: yolo_visual_center
      target_class: cylinder_2
      velocity_scaling: 0.12
      acceleration_scaling: 0.12
      max_step_m: 0.005
      min_fraction: 0.85
      delay_after_sec: 0.2

    - name: FoundationPose_And_GraspPrep
      type: foundation_pose
      target_class: cylinder_2
      include_grasp_prep_orientation: true
      lookat_vector: [0.0, 0.0, -1.0]
      tcp_roll_rad: 0.0
      velocity_scaling: 0.12
      acceleration_scaling: 0.12
      max_step_m: 0.005
      min_fraction: 0.85
      delay_after_sec: 0.2
