motion:
  planning_group: ur_manipulator
  base_frame: base_link
  tcp_file: /home/wonny/ur3_control/src/ROS2_MuJoCo_UR3/src/ur3_rl_bridge/config/tcp/gripper_tip.yaml
  ik_link_name: tool0
  move_group_action: /move_action
  sequence_action: /sequence_move_group
  cartesian_path_service: /compute_cartesian_path
  trajectory_action: /joint_trajectory_controller/follow_joint_trajectory
  avoid_collisions: true
  planning_scene_topic: /planning_scene
  planning_scene_settle_sec: 0.12
  # moveit = safer collision-aware route planning, linear = direct straight Cartesian path.
  default_cartesian_mode: moveit
  default_planning_time_sec: 3.0
  default_planning_attempts: 5
  default_joint_state_timeout_sec: 5.0
  default_joint_tolerance_rad: 0.0001
  default_max_step_m: 0.0005
  default_jump_threshold: 2.0
  default_min_fraction: 0.95

# Vision (YOLO + camera topics). Used by type: yolo_visual_center (or yolo_visual_lookat_and_approach).
# Camera topics are subscribed only when that action starts (no buffering from ros2 run through earlier steps).
# Flow: (1) YOLO lock + Cartesian optical centering (default); (2) optical approach (smooth trajectory).
# Optional: yolo_visual_center_centering_mode: servo (requires servo_node in launch). Tune yolo_center_* / yolo_servo_*.
# Restore grasp frame before approach: yolo_visual_center_restore_pick_orientation_before_approach + lookat_vector/tcp_roll_rad.
# yolo_tracking_* , yolo_visual_center_acquire_* , yolo_visual_center_redetect_* .
# approach_max_iterations, approach_step_max_m — see vision defaults in action_sequencer._merge_vision_config.
# YOLO dropout smoothing / acquisition: yolo_tracking_* , yolo_predict_conf_floor, yolo_class_match_case_insensitive,
# yolo_visual_center_acquire_* (initial lock), yolo_visual_center_redetect_* (last pose + camera nudges after N misses).
# Principal-point centering matches pinhole rays: center_tolerance_px vs (cx,cy) from CameraInfo.
# yolo_visual_center_single_motion: false → iterative centering + approach until depth/center tolerances.
vision:
  yolo_model_path: /home/wonny/ur3_control/runs/segment/ur3_multi_sim_real/weights/best.pt
  min_confidence: 0.4
  target_distance_m: 0.38
  rgb_topic: /rl_camera/color
  depth_topic: /rl_camera/depth
  camera_info_topic: /rl_camera/camera_info
  camera_optical_frame: rl_camera_frame
  max_iterations: 8
  approach_max_iterations: 10
  approach_step_max_m: 0.06
  yolo_visual_center_smooth_approach: true
  center_tolerance_px: 15
  # servo = smooth velocity (base_link, same direction as Cartesian); cartesian = position stream fallback
  yolo_visual_center_centering_mode: servo
  center_max_iterations: 40
  yolo_center_step_gain: 0.35
  yolo_center_max_step_m: 0.012
  yolo_center_max_duration_sec: 60
  yolo_center_path_segments: 20
  yolo_center_cartesian_max_step_m: 0.002
  yolo_center_velocity_scaling: 0.05
  yolo_center_acceleration_scaling: 0.05
  yolo_center_redetect_after_misses: 30
  yolo_center_use_raw_detection: true
  yolo_visual_center_require_centered_on_complete: true
  yolo_visual_center_avoid_collisions: true
  yolo_servo_rate_hz: 15
  yolo_servo_max_duration_sec: 90
  yolo_servo_use_raw_only: false
  yolo_servo_use_smoothed_for_twist: true
  yolo_servo_use_optical_ibvs: true
  yolo_servo_cartesian_fallback: true
  yolo_servo_offset_ema_alpha: 0.28
  yolo_servo_velocity_ema_alpha: 0.28
  yolo_servo_max_twist_delta_m_s: 0.004
  yolo_servo_cartesian_speed_scale: 0.45
  yolo_servo_diverge_correct_after: 0
  yolo_servo_cartesian_nudge_every_sec: 0
  yolo_servo_cartesian_nudge_min_metric_px: 80
  yolo_servo_diverge_min_metric_px: 120
  yolo_servo_match_cartesian_gain: false
  yolo_servo_gain_scale: 0.22
  yolo_servo_linear_gain: 0.35
  yolo_servo_velocity_in_base: true
  yolo_servo_command_frame: rl_camera_frame
  yolo_servo_ibvs_sign: -1.0
  yolo_servo_ibvs_sign_u: 1.0
  yolo_servo_ibvs_sign_v: -1.0
  yolo_servo_max_axis_offset_px: 95
  yolo_servo_diverge_abort_streak: 0
  yolo_servo_cmd_on_keepalive: true
  yolo_servo_slow_error_px: 100
  yolo_servo_near_center_ramp_px: 100
  yolo_servo_near_center_min_scale: 0.35
  yolo_servo_deadband_px: 8
  yolo_servo_fine_pass: true
  yolo_servo_fine_pass_max_duration_sec: 20
  yolo_servo_fine_pass_max_linear_m_s: 0.005
  yolo_servo_cross_brake_frames: 0
  yolo_servo_warmup_raw_frames: 2
  yolo_servo_redetect_after_misses: 15
  yolo_redetect_skip_snap_back_after_servo: true
  yolo_servo_angular_gain: 0.0
  yolo_servo_use_angular: false
  yolo_servo_max_linear_m_s: 0.007
  yolo_servo_max_angular_rad_s: 0.15
  yolo_servo_stable_frames: 3
  yolo_visual_center_single_motion: false
  yolo_visual_center_single_motion_max_translation_m: 2.0
  yolo_predict_conf_floor: 0.01
  yolo_class_match_case_insensitive: true
  yolo_visual_center_acquire_max_attempts: 120
  yolo_visual_center_acquire_min_confidence: 0.25
  yolo_visual_center_acquire_spin_sec: 0.05
  yolo_visual_center_redetect_after_misses: 10
  yolo_visual_center_redetect_max_sessions: 3
  yolo_visual_center_redetect_velocity_scaling: 0.15
  yolo_visual_center_redetect_nudge_step_m: 0.012
  yolo_visual_center_redetect_nudge_max_trials: 16
  yolo_visual_center_min_detection_depth_m: 0.35
  yolo_tracking_keep_alive_max_misses: 25
  # Keep Look/centering camera pose through approach; pick lookat [0,0,-1] is for grasp steps only.
  yolo_visual_center_restore_pick_orientation_before_approach: false
  distance_tolerance_m: 0.025
  step_gain: 0.45
  default_target_class: ""

object_sequences:
  Cylinder_1: [Cylinder_Module1, Cylinder_1_Module2]
  # Fast YOLO-only path (Look → center/approach). Use Target Object: Cylinder_2 or cylinder_2.
  Cylinder_2: [Cylinder_2_YOLO_Test]
  cylinder_2: [Cylinder_2_YOLO_Test]
  Box_1: [Box_1_Module1, Box_1_Module2]

# =============================================================================
# Named presets (edit here; reference from any action under sequences:)
#
# MoveIt / RViz (planning scene) — independent of MuJoCo physics:
#   Per-action keys on any step:
#     keepout_preset: <name>   (alias: forbidden_zone) — adds axis-aligned obstacle before the step;
#                              removed after the step if keepout_remove_after: true (default).
#     attach_preset: <name>   — attached collision on tool0 (or link_name in preset)
#     detach_preset: <name>   — runs before attach_preset if both are set
#   Or use type: planning_scene with operation + preset: <name>
#
# MuJoCo sim only (plate/case weld services today — tool0 module attach is config-first):
#   weld: mujoco_weld_preset: <name>  merges fields from mujoco_weld_presets below.
#   When you add new Trigger services in mujoco_ros2_control, only change YAML here.
#
# Six product lines (Box_1_module_2, not Box_2): Cylinder_1/2 module_1/2, Box_1 module_1/2.
# =============================================================================

forbidden_zone_presets:
  # Example: forbidden region while running Module_2_Visual_Center_YOLO (tune to your table).
  module2_yolo_forbidden:
    object_id: fz_module2_yolo
    frame_id: base_link
    x_min: -0.03
    x_max: 0.13
    y_min: -0.44
    y_max: -0.12
    z_min: 0.01
    z_max: 0.115

planning_attach_presets:
  # Attached bodies are MoveIt collision objects (PlanningScene), shown in RViz MotionPlanning → Scene Geometry.
  # Per object: shape box (default): dimensions [dx, dy, dz].  shape cylinder: dimensions [height, radius]
  # (ROS: axis along +Z of the object pose; tilt with pose_rpy in link frame).
  Cylinder_1_module_1_attach_tool0:
    link_name: tool0
    touch_links: [wrist_3_link, tool0, gripper_link]
    objects:
      - id: attach_cyl1_m1
        shape: cylinder
        dimensions: [0.12, 0.038]
        pose_xyz: [0.0, 0.0, 0.07]
        pose_rpy: [0, 0, 0]
  Cylinder_1_module_2_attach_tool0:
