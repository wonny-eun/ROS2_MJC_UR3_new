motion:
  planning_group: ur_manipulator
  base_frame: base_link
  tcp_file: /home/wonny/ur3_control/src/ROS2_MuJoCo_UR3/src/ur3_rl_bridge/config/tcp/gripper_tip.yaml
  ik_link_name: tool0
  move_group_action: /move_action
  sequence_action: /sequence_move_group
  cartesian_path_service: /compute_cartesian_path
  trajectory_action: /joint_trajectory_controller/follow_joint_trajectory
  avoid_collisions: true
  planning_scene_topic: /planning_scene
  planning_scene_settle_sec: 0.12
  # moveit = safer collision-aware route planning, linear = direct straight Cartesian path.
  default_cartesian_mode: moveit
  default_planning_time_sec: 3.0
  default_planning_attempts: 5
  default_joint_state_timeout_sec: 5.0
  default_joint_tolerance_rad: 0.0001
  default_max_step_m: 0.0005
  default_jump_threshold: 2.0
  default_min_fraction: 0.95

# Vision: merged with action_sequencer._merge_vision_config defaults (only entries below override the code defaults).
# MUST match ur3_mujoco_moveit.launch.py: yolo_model_path + /rl_camera/noisy/* (same as yolo_object_preview).
# If preview shows Box_1 ~0.98 but sequencer sees ~0.02, you were on different weights/topics.
vision:
  yolo_model_path: /home/wonny/ur3_control/runs/segment/ur3_multi_sim_real_ultra/weights/best.pt
  rgb_topic: /rl_camera/noisy/color
  depth_topic: /rl_camera/noisy/depth
  camera_info_topic: /rl_camera/camera_info
  min_confidence: 0.6
  # One product in view; resolves Cylinder_1 vs Cylinder_2 label flip on the SAME object.
  # Selection prefers target_class (Box_1 when you pick Box_1), not highest conf across types.
  yolo_exclusive_scene_classes:
    - Box_1
    - Cylinder_1
    - Cylinder_2
  # Standoff depth along camera optical axis (350 mm = 0.35 m).
  target_distance_m: 0.35
  # One YOLO sample after Look → single MoveGroup IK (no Cartesian path / nudge loop).
  yolo_visual_center_centering_mode: moveit_one_shot
  yolo_visual_center_avoid_collisions: true
  yolo_visual_center_recenter_at_depth: false
  yolo_visual_center_recenter_on_approach_drift: false
  # 0 = absolute depth goal (target_distance_m), not "move N m closer from current depth".
  yolo_visual_center_approach_forward_m: 0.0
  yolo_visual_center_single_motion: false
  yolo_center_max_plan_iterations: 5
  yolo_single_motion_center_max_nudges: 2
  yolo_center_allow_soft_complete: false
  yolo_center_tolerance_metric: l1
  yolo_center_direct_path_segments: 1
  yolo_center_direct_fraction: 1.0
  yolo_center_direct_step_gain: 1.0
  yolo_center_command_ema_alpha: 0.0
  yolo_center_after_stream_spin_frames: 8
  yolo_center_after_stream_spin_period_sec: 0.04
  yolo_visual_center_recenter_at_depth: true
  yolo_visual_center_recenter_at_depth_max_nudges: 3
  yolo_visual_center_recenter_on_approach_drift: true
  max_iterations: 5
  approach_max_iterations: 4
  # Must be below target_distance_m (0.37); 0.35 blocked retreat-toward-goal (terminal bug).
  yolo_visual_center_min_detection_depth_m: 0.30
  center_tolerance_px: 5
  # MoveIt often reports ~0.42 on short lateral nudges; 0.45 rejects valid paths (see terminal).
  yolo_center_min_fraction: 0.32
  yolo_center_min_fraction_relaxed: 0.02
  yolo_center_cartesian_max_step_m: 0.001
  yolo_center_skip_collision_check: true
  yolo_visual_center_avoid_collisions: false
  center_max_iterations: 5
  distance_tolerance_m: 0.01
  yolo_center_adaptive_far_metric_px: 130
  yolo_center_adaptive_near_metric_px: 45
  yolo_center_step_gain: 0.37
  yolo_center_max_step_m: 0.013
  yolo_center_step_gain_near: 0.30
  yolo_center_step_gain_far: 0.56
  yolo_center_max_step_m_near: 0.008
  yolo_center_max_step_m_far: 0.021
  yolo_center_velocity_scaling_near: 0.052
  yolo_center_velocity_scaling_far: 0.10
  yolo_center_pixel_direct: true
  yolo_center_direct_max_step_m_hard_abs: 0.14
  # If lateral centering fails (fixed TCP orientation), rotate camera in optical frame.
  yolo_center_enable_orient_fallback: true
  yolo_center_orient_max_attempts: 4
  yolo_center_orient_max_step_rad: 0.085
  yolo_center_orient_step_gain: 0.42
  # camera_color_optical_frame vs rl_camera_frame (URDF rpy 0 0 -π): X flipped, Y unchanged from pre-optical tuning.
  yolo_center_orient_sign_u: -1.0
  yolo_center_orient_sign_v: -1.0
  yolo_servo_ibvs_sign_u: -1.0
  yolo_servo_ibvs_sign_v: -1.0
  # Safer vs arm self-collision: YOLO goals via MoveIt IK + joint plan (no straight Cartesian).
  # yolo_visual_center_centering_mode: moveit_ik
  yolo_servo_rate_hz: 15
  yolo_servo_use_optical_ibvs: false
  yolo_servo_command_frame: camera_color_optical_frame
  yolo_servo_linear_gain: 0.22
  yolo_servo_max_linear_m_s: 0.006
  yolo_visual_center_acquire_max_attempts: 120
  # Bootstrap lock: Box_1 often 0.02–0.08 when cylinders dominate FOV; depth uses center ROI fallback.
  yolo_visual_center_acquire_min_confidence: 0.02
  yolo_depth_min_bbox_pixels: 4
  depth_roi_half_px: 12
  yolo_tracking_keep_alive_max_misses: 25








# FoundationPose: only chained in sequences.Cylinder_2 for now (add same block to Box_1 / Cylinder_1 when ready).
#   ros2 launch ur3_rl_bridge foundation_pose_bridge.launch.py
foundation_pose:
  bridge_trigger_service: /foundation_pose_bridge/trigger
  bridge_set_parameters_service: /foundation_pose_bridge/set_parameters
  object_tf_child_frame: fp_object
  # Smooth fp_object TF from FoundationPose /output (foundation_pose_output_tf_node).
  tf_filter_enable: true
  tf_filter_window: 10
  tf_filter_require_full_window: false
  tf_reference_frame: base_link
  wait_tf_timeout_sec: 45.0
  record_bbox_snapshot_on_yolo_complete: true
  # YOLO label is Box_1; mesh file is square_1.obj — alias CAD names to detector class.
  yolo_class_aliases:
    square_1: Box_1
    box_1: Box_1
  bridge_trigger_min_confidence: 0.5
  sync_vision_camera_topics: true
  symmetry_axes_by_class_text: "Cylinder_*: set z_full (or correct axis) on Isaac launch after verifying OBJ axis"
  mesh_relative_by_class:
    Cylinder_1: meshes/foundationpose/cylinder_1.obj
    Cylinder_2: meshes/foundationpose/cylinder_2.obj
    cylinder_1: meshes/foundationpose/cylinder_1.obj
    cylinder_2: meshes/foundationpose/cylinder_2.obj
    Box_1: meshes/foundationpose/square_1.obj
    box_1: meshes/foundationpose/square_1.obj







object_sequences:
  # Box_1: YOLO look + center + approach only. Append Box_1_Module1/2 for full pick.
  Box_1: [Box_1, Box_1_Module1, Box_1_Module2]
  Cylinder_1: [Cylinder_1]
  Cylinder_2: [Cylinder_2]








