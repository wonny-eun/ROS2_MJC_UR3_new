# Real UR3 action sequences — tune poses/speeds here without affecting MuJoCo sim.
# Loaded by run_real_action_sequencer.sh (UR3_ACTION_CONFIG override).
motion:
  # real = skip MuJoCo-only weld/trigger services; MoveIt planning-scene attach/detach still runs.
  robot_backend: real
  # Global multiplier for normal arm move steps only: joint/cartesian/tool_delta/waypoint.
  # YOLO centering, FoundationPose, and gripper actions keep their configured speeds.
  # Overridden by run_action_sequencer.sh 2nd arg or -p speed_scale:=.
  speed_scale: 1.0
  planning_group: ur_manipulator
  base_frame: base_link
  tcp_file: /home/wonny/ur3_control/src/ROS2_MuJoCo_UR3/src/ur3_rl_bridge/config/tcp/gripper_tip.yaml
  ik_link_name: tool0
  move_group_action: /move_action
  sequence_action: /sequence_move_group
  cartesian_path_service: /compute_cartesian_path
  trajectory_action: /scaled_joint_trajectory_controller/follow_joint_trajectory
  real_cartesian_retime_min_segment_sec: 0.08
  real_cartesian_retime_duration_stretch: 2.0
  cartesian_retime_max_joint_vel_rad_s: 0.35
  avoid_collisions: true
  planning_scene_topic: /planning_scene
  planning_scene_settle_sec: 0.12
  # moveit = safer collision-aware route planning, linear = direct straight Cartesian path.
  default_cartesian_mode: moveit
  default_planning_time_sec: 3.0
  default_planning_attempts: 10
  default_joint_state_timeout_sec: 5.0
  # Wait for MuJoCo joint velocities to settle before sending the next MoveIt command.
  # Prevents "Invalid Trajectory: start point deviates from current robot state" between fast steps.
  wait_for_joint_settle: true
  joint_settle_timeout_sec: 1.0
  joint_settle_max_velocity_rad_s: 0.02
  joint_settle_required_samples: 3
  default_joint_tolerance_rad: 0.0001
  default_max_step_m: 0.0005
  default_jump_threshold: 2.0
  default_min_fraction: 0.95

# Vision: real D435i via realsense2_camera (no simulated noise layer).
vision:
  yolo_model_path: /home/wonny/ur3_control/runs/segment/ur3_multi_sim_real_ultra/weights/best.pt
  # Per-action YOLO lifecycle (action_sequencer only; not the MoveIt yolo_object_preview node):
  #   Look: yolo_detection_enable: true     → arm camera subs + load model after Look completes (before delay_after warmup)
  #   yolo_visual_center: yolo_detection_disable: true → disarm after centering (success or fail)
  # Set UR3_YOLO_PREVIEW=false on MoveIt launch to avoid a second always-on YOLO process.
  rgb_topic: /camera/camera/color/image_raw
  depth_topic: /camera/camera/aligned_depth_to_color/image_raw
  camera_info_topic: /camera/camera/color/camera_info
  camera_optical_frame: camera_color_optical_frame
  min_confidence: 0.6
  # Look sees Box_1 + Cylinder_1 + Cylinder_2. Scene-unique assignment compares class scores per
  # physical object (crop re-score for Cylinder_1 vs Cylinder_2) so each class appears once.
  yolo_scene_unique_classes: true
  yolo_scene_assign_rescore_crops: true
  yolo_scene_assign_cluster_iou: 0.45
  yolo_pick_among_strategy: scene_unique
  yolo_exclusive_scene_classes:
    - Box_1
    - Cylinder_1
    - Cylinder_2
  # Standoff depth along camera optical axis (350 mm = 0.35 m).
  target_distance_m: 0.35
  # One YOLO sample after Look → streamed Cartesian nudges (low CPU). Avoid moveit_one_shot for real arm.
  yolo_visual_center_centering_mode: cartesian
  # Centering uses Look pose only. On fail: recovery move (+Z, tool +X roll) → redetect → restart centering.
  yolo_visual_center_ik_step_scales: [1.0, 0.5, 0.25]
  yolo_moveit_one_shot_max_retries: 1
  yolo_visual_center_recovery_max_sessions: 1
  yolo_visual_center_recovery_lift_step_m: 0.04
  yolo_visual_center_recovery_roll_step_deg: 5.0
  yolo_visual_center_recovery_redetect_attempts: 40
  yolo_visual_center_recovery_settle_frames: 30
  yolo_visual_center_avoid_collisions: true
  yolo_visual_center_recenter_at_depth: false
  yolo_visual_center_recenter_on_approach_drift: false
  # 0 = absolute depth goal (target_distance_m), not "move N m closer from current depth".
  yolo_visual_center_approach_forward_m: 0.0
  yolo_visual_center_single_motion: false
  yolo_center_max_plan_iterations: 8
  yolo_single_motion_center_max_nudges: 2
  yolo_center_allow_soft_complete: true
  yolo_center_max_duration_sec: 35.0
  yolo_center_tolerance_metric: l1
  yolo_center_direct_path_segments: 1
  yolo_center_direct_fraction: 1.0
  yolo_center_direct_step_gain: 1.0
  yolo_center_command_ema_alpha: 0.0
  yolo_center_after_stream_spin_frames: 8
  yolo_center_after_stream_spin_period_sec: 0.04
  yolo_visual_center_recenter_at_depth: true
  yolo_visual_center_recenter_at_depth_max_nudges: 3
  yolo_visual_center_recenter_on_approach_drift: true
  max_iterations: 5
  approach_max_iterations: 4
  # Must be below target_distance_m (0.37); 0.35 blocked retreat-toward-goal (terminal bug).
  yolo_visual_center_min_detection_depth_m: 0.30
  center_tolerance_px: 15
  # MoveIt often reports ~0.42 on short lateral nudges; 0.45 rejects valid paths (see terminal).
  yolo_center_min_fraction: 0.15
  yolo_center_min_fraction_relaxed: 0.01
  yolo_center_cartesian_max_step_m: 0.003
  yolo_center_skip_collision_check: true
  yolo_visual_center_avoid_collisions: true
  center_max_iterations: 5
  distance_tolerance_m: 0.01
  yolo_center_adaptive_far_metric_px: 130
  yolo_center_adaptive_near_metric_px: 45
  yolo_center_step_gain: 0.25
  yolo_center_max_step_m: 0.013
  yolo_center_step_gain_near: 0.20
  yolo_center_step_gain_far: 0.40
  yolo_center_max_step_m_near: 0.008
  yolo_center_max_step_m_far: 0.021
  yolo_center_velocity_scaling_near: 0.052
  yolo_center_velocity_scaling_far: 0.10
  yolo_center_pixel_direct: true
  yolo_center_direct_max_step_m_hard_abs: 0.14
  # If lateral centering fails (fixed TCP orientation), rotate camera in optical frame.
  yolo_center_enable_orient_fallback: true
  yolo_center_orient_max_attempts: 6
  yolo_center_orient_max_step_rad: 0.12
  yolo_center_orient_step_gain: 0.42
  # camera_color_optical_frame vs rl_camera_frame (URDF rpy 0 0 -π): X flipped, Y unchanged from pre-optical tuning.
  yolo_center_orient_sign_u: 1.0
  yolo_center_orient_sign_v: 1.0
  yolo_servo_ibvs_sign_u: -1.0
  yolo_servo_ibvs_sign_v: -1.0
  # Safer vs arm self-collision: YOLO goals via MoveIt IK + joint plan (no straight Cartesian).
  # yolo_visual_center_centering_mode: moveit_ik
  yolo_servo_rate_hz: 15
  yolo_servo_use_optical_ibvs: false
  yolo_servo_command_frame: camera_color_optical_frame
  yolo_servo_linear_gain: 0.22
  yolo_servo_max_linear_m_s: 0.006
  yolo_visual_center_acquire_max_attempts: 120
  # Bootstrap lock: Box_1 often 0.02–0.08 when cylinders dominate FOV; depth uses center ROI fallback.
  yolo_visual_center_acquire_min_confidence: 0.02
  yolo_depth_min_bbox_pixels: 4
  depth_roi_half_px: 12
  yolo_tracking_keep_alive_max_misses: 25





# FoundationPose: action type ``foundation_pose_grasp`` auto-launches the full stack
# (bridge + Isaac via foundation_pose_stack_realsense.launch.py) — RealSense must be running.
foundation_pose:
  stack_launch_file: foundation_pose_stack_realsense.launch.py
  bridge_trigger_service: /foundation_pose_bridge/trigger
  bridge_set_parameters_service: /foundation_pose_bridge/set_parameters
  object_tf_child_frame: fp_object
  auto_launch_stack: true
  # Stop any leftover Isaac stack and relaunch with the target-class mesh (avoids square_1.obj leftovers).
  force_relaunch_stack_on_grasp: true
  # Release GPU/camera load after foundation_pose / foundation_pose_grasp actions.
  stop_stack_after_action: true
  stop_stack_on_sequencer_exit: true
  stack_launch_timeout_sec: 120.0
  bridge_post_launch_settle_sec: 3.0
  bridge_camera_warmup_timeout_sec: 12.0
  # Push bridge params after cold settle (not immediately at launch) — avoids SetParameters timeout.
  bridge_set_parameters_service_wait_sec: 25.0
  bridge_set_parameters_timeout_sec: 25.0
  bridge_set_parameters_timeout_fresh_sec: 60.0
  bridge_set_parameters_retries: 4
  bridge_set_parameters_retry_pause_sec: 3.0
  bridge_skip_yolo_model_path_push: true
  wait_tf_stable: true
  tf_stable_sample_count: 30
  tf_stable_sample_period_sec: 0.12
  tf_stable_max_position_std_m: 0.003
  tf_stable_max_rotation_deg: 1.5
  tf_stable_max_yaw_std_deg: 2.0
  tf_stable_warmup_sec: 1.0
  tf_stable_min_elapsed_sec: 3.0
  tf_stable_timeout_sec: 60.0
  fp_post_trigger_settle_sec: 2.0
  # YOLO-seg instance mask → /segmentation (foundation_pose_bridge; disables Detection2DToMask).
  use_yolo_segmentation_mask: true
  segmentation_mask_width: 640
  segmentation_mask_height: 480
  # Per-class grasp offsets / TCP↔object axis map (installed with ur3_pick_task).
  grasp_config_file: ""
  # MoveIt IK link for foundation_pose_grasp (empty → gripper_tip from gripper_tip.yaml).
  ik_link_name: gripper_tip
  # Smooth fp_object TF from FoundationPose /output (foundation_pose_output_tf_node).
  tf_filter_enable: true
  tf_filter_window: 15
  tf_filter_require_full_window: true
  tf_reference_frame: base_link
  camera_optical_frame: camera_color_optical_frame
  isaac_output_topic: /output
  # Only after cold launch / force_relaunch (TensorRT). Skipped if stack already running.
  isaac_post_launch_settle_sec: 1.0
  isaac_post_launch_settle_if_reused_sec: 0.0
  isaac_output_wait_timeout_sec: 120.0
  # Wait for Nitros rgb bridge after cold launch (before trigger / TF).
  isaac_pipeline_ready_timeout_sec: 90.0
  isaac_input_topics_timeout_sec: 30.0
  isaac_rgb_rect_topic: /rgb/image_rect_color
  isaac_depth_rect_topic: /depth_registered/image_rect
  bridge_retrigger_period_sec: 8.0
  wait_tf_timeout_sec: 45.0
  # Legacy single-stage standoff (per-class grasp YAML still wins if set there).
  approach_standoff_m: 0.06
  # Two-stage grasp: hover (generous) then plunge (1 cm touch).
  hover_approach_standoff_m: 0.12
  touch_approach_standoff_m: 0.01
  hover_ik_step_scales: [1.0, 0.5, 0.25]
  hover_convergence_max_iterations: 8
  hover_convergence_settle_sec: 0.5
  plunge_min_fraction: 0.5
  plunge_max_step_m: 0.002
  plunge_cartesian_mode: moveit
  record_bbox_snapshot_on_yolo_complete: false
  yolo_class_aliases:
    square_1: Box_1
    box_1: Box_1
  bridge_trigger_min_confidence: 0.5
  sync_vision_camera_topics: true
  # Isaac FoundationPose rotational symmetries in mesh frame (see meshes/foundationpose/README.md).
  symmetry_axes_by_class:
    Cylinder_1: [y_full]
    Cylinder_2: [y_full]
    # Box_1: table-top box (+Z up); 180° flip about vertical only (not y_full on short +Y).
    Box_1: [z_180]
  mesh_relative_by_class:
    Cylinder_1: meshes/foundationpose/cylinder_1.obj
    Cylinder_2: meshes/foundationpose/cylinder_2.obj
    cylinder_1: meshes/foundationpose/cylinder_1.obj
    cylinder_2: meshes/foundationpose/cylinder_2.obj
    Box_1: meshes/foundationpose/square_1.obj
    box_1: meshes/foundationpose/square_1.obj

# Gripper: MuJoCo hybrid (sim) | Dynamixel XM540 adaptive grasp (real, see ~/ur3_control/gripper/).
gripper:
  hybrid_close_service: /mujoco/gripper/hybrid_close
  hybrid_open_service: /mujoco/gripper/hybrid_open
  set_parameters_service: /mujoco_node/set_parameters
  close_position_rad: 1.396
  hold_torque_nm: 2.0
  approach_ramp_rad_s: 0.35
  min_feedback_torque_nm: 1.0
  max_joint_speed_rad_s: 0.15
  contact_confirm_steps: 5
  hold_sec: 2.0
  timeout_sec: 45.0
  position_kp: 500.0
  position_kv: 30.0
  service_call_timeout_sec: 60.0
  # Real UR3 — gripper_hybrid_close runs dynamixel_adaptive_grasp.py when robot_backend=real
  dynamixel_grasp_script: /home/wonny/ur3_control/gripper/dynamixel_adaptive_grasp.py
  dynamixel_device: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT891L5D-if00-port0
  dynamixel_baudrate: 1000000
  dynamixel_id: 1
  dynamixel_hold_time: 1.5
  dynamixel_torque_off_after_hold: false
  dynamixel_require_contact: false
  # Close (adaptive grasp): profile_velocity=30, step_pulse=20 @ 0.05s
  dynamixel_profile_velocity: 0
  dynamixel_profile_acceleration: 0
  dynamixel_pre_close_position: 0
  dynamixel_sleep_time: 0.05
  dynamixel_max_total_move: 930
  dynamixel_step_pulse: 15
  dynamixel_contact_threshold: 40
  dynamixel_contact_count_required: 5
  
  # Open (gripper_hybrid_open): moderate speed, slightly faster than close
  dynamixel_open_position: 0
  dynamixel_open_profile_velocity: 20
  dynamixel_open_profile_acceleration: 5
  dynamixel_move_timeout_sec: 10.0
  dynamixel_position_tolerance: 20

object_sequences:
  # Box_1: YOLO look + center + approach only. Append Box_1_Module1/2 for full pick.
  Box_1: Box_1_Sequence
  Cylinder_1: Cylinder_1_Sequence
  Cylinder_2: Cylinder_2_Sequence
  UR3_Connect_Test: UR3_Connect_Test
  Gripping_Test: Gripping_Test








